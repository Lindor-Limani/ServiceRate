plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'at.hcw'
version = '0.0.1-SNAPSHOT'
description = 'ServiceRateBackend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

ext {
	set('tomcat.version', '11.0.24')
	set('logback.version', '1.5.37')
	set('jackson-2-bom.version', '2.21.5')
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JWT Dependencies
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	implementation 'com.stripe:stripe-java:33.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
	def jwtTestSecret = new byte[32]
	new java.security.SecureRandom().nextBytes(jwtTestSecret)
	systemProperty 'security.jwt.secret-base64', java.util.Base64.encoder.encodeToString(jwtTestSecret)
	systemProperty 'security.jwt.key-id', 'test-' + java.util.UUID.randomUUID()
}

tasks.register('verifySecurityPatchedRuntime') {
	group = 'verification'
	description = 'Fails when security-patched framework runtime versions regress.'
	doLast {
		def expectedVersions = [
			'org.springframework.boot:spring-boot'                  : '4.0.7',
			'org.springframework.security:spring-security-core'    : '7.0.6',
			'org.apache.tomcat.embed:tomcat-embed-core'             : '11.0.24',
			'tools.jackson.core:jackson-databind'                   : '3.1.4',
			'com.fasterxml.jackson.core:jackson-databind'           : '2.21.5',
			'ch.qos.logback:logback-classic'                        : '1.5.37'
		]
		def resolvedVersions = [:]
		def collectDependency
		collectDependency = { dependency ->
			resolvedVersions["${dependency.moduleGroup}:${dependency.moduleName}"] = dependency.moduleVersion
			dependency.children.each(collectDependency)
		}
		configurations.runtimeClasspath.resolvedConfiguration.firstLevelModuleDependencies.each(collectDependency)

		expectedVersions.each { coordinate, expectedVersion ->
			def resolvedVersion = resolvedVersions[coordinate]
			if (resolvedVersion != expectedVersion) {
				throw new GradleException("${coordinate} must resolve to ${expectedVersion}, but resolved to ${resolvedVersion ?: 'missing'}")
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifySecurityPatchedRuntime')
}
