spring.application.name=ServiceRateBackend
spring.config.import=optional:file:src/.env[.properties],optional:file:backend/ServiceRateBackend/src/.env[.properties]
server.port=${SERVER_PORT:8081}
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=1KB

# JWT: Secret und Key-ID sind Pflichtwerte ohne Repository-Default.
# JWT_SECRET_BASE64 muss mindestens 32 zufällige Bytes in Base64 enthalten.
security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.key-id=${JWT_KEY_ID}
security.jwt.issuer=${JWT_ISSUER:servicerate}
security.jwt.audience=${JWT_AUDIENCE:servicerate-api}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Marketplace/Provision
app.platform-fee-percent=${APP_PLATFORM_FEE_PERCENT:10}
app.platform-fee-fixed=${APP_PLATFORM_FEE_FIXED:0}

# PostgreSQL Datenbank Verbindung
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5533/servicerate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate DDL Auto (Erstellt die 4 Tabellen automatisch)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Externe APIs
openweather.api-key=${OPENWEATHER_API_KEY:}

# PayPal REST Checkout
# PAYPAL_MODE=sandbox fuer Tests, PAYPAL_MODE=live fuer Produktion
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.return-url=${PAYPAL_RETURN_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/customer-app.html}
paypal.cancel-url=${PAYPAL_CANCEL_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/customer-app.html}
paypal.seller-return-url=${PAYPAL_SELLER_RETURN_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/provider-dashboard.html}
paypal.partner-attribution-id=${PAYPAL_PARTNER_ATTRIBUTION_ID:}
paypal.partner-merchant-id=${PAYPAL_PARTNER_MERCHANT_ID:}

# Stripe Connect / Checkout
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:eur}
stripe.connect.country=${STRIPE_CONNECT_COUNTRY:AT}
stripe.refresh-url=${STRIPE_REFRESH_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/provider-dashboard.html?stripe=refresh}
stripe.return-url=${STRIPE_RETURN_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/provider-dashboard.html?stripe=return}
stripe.checkout-success-url=${STRIPE_CHECKOUT_SUCCESS_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/customer-app.html?stripe=success&session_id={CHECKOUT_SESSION_ID}}
stripe.checkout-cancel-url=${STRIPE_CHECKOUT_CANCEL_URL:${APP_FRONTEND_BASE_URL:http://localhost:5500}/customer-app.html?stripe=cancel}

# App URLs fuer Mail-Links
app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:8081}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5500}

# Mail: APP_MAIL_MODE=console fuer lokale Entwicklung, APP_MAIL_MODE=smtp fuer echten Versand
app.mail.mode=${APP_MAIL_MODE:console}
app.mail.host=${APP_MAIL_HOST:}
app.mail.port=${APP_MAIL_PORT:587}
app.mail.username=${APP_MAIL_USERNAME:}
app.mail.password=${APP_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:servicerate@llimani.at}
app.mail.starttls=${APP_MAIL_STARTTLS:true}
app.mail.ssl=${APP_MAIL_SSL:false}

# Nur fuer lokale Entwicklung: Tokens/Links in die Backend-Konsole schreiben
app.dev.log-tokens=${APP_DEV_LOG_TOKENS:false}
