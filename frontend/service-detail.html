<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>ServiceRate - Service Details</title>
  <script>
    try {
      const mode = localStorage.getItem('servicerate_view_mode');
      if (mode !== 'grid' && mode !== 'list') localStorage.setItem('servicerate_view_mode', 'list');
    } catch {}
  </script>
  <link rel="stylesheet" href="customer-style.css?v=20260707-first-list-boot1" />
</head>
<body>
<header>
  <a class="logo" href="customer-app.html">Service<span>Rate</span></a>
  <div class="header-right">
    <a href="customer-app.html" class="btn btn-ghost btn-sm">Zurück zum Marktplatz</a>
  </div>
</header>

<main class="main">
  <div id="serviceDetailRoot">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <p>Service wird geladen...</p>
    </div>
  </div>
</main>

<div class="gallery-lightbox" id="galleryLightbox" onclick="if(event.target===this)closeGallery()">
  <button class="modal-close gallery-close" onclick="closeGallery()">✕</button>
  <button class="gallery-nav gallery-prev" onclick="moveGallery(-1)">‹</button>
  <img id="galleryImage" alt="Servicefoto groß" />
  <button class="gallery-nav gallery-next" onclick="moveGallery(1)">›</button>
  <div class="gallery-counter" id="galleryCounter"></div>
</div>

<div class="overlay" id="reportModal" onclick="if(event.target===this)closeReportDialog()">
  <div class="modal report-modal">
    <div class="modal-header">
      <div>
        <span class="modal-kicker danger">Service melden</span>
        <h2 class="modal-title">Was ist das Problem?</h2>
      </div>
      <button class="modal-close" onclick="closeReportDialog()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Grund</label>
      <select class="form-input" id="reportReason">
        <option value="Unangemessener Inhalt">Unangemessener Inhalt</option>
        <option value="Falsche Angaben">Falsche Angaben</option>
        <option value="Verdacht auf Betrug">Verdacht auf Betrug</option>
        <option value="Anderer Grund">Anderer Grund</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Details</label>
      <textarea class="form-input" id="reportDetails" rows="4" placeholder="Beschreibe kurz, was Admins prüfen sollen."></textarea>
    </div>
    <div class="report-actions">
      <button class="btn btn-ghost" onclick="closeReportDialog()">Abbrechen</button>
      <button class="btn btn-danger" onclick="submitServiceReport()">Meldung absenden</button>
    </div>
  </div>
</div>

<script src="utils.js?v=20260707-first-list-boot1"></script>
<script src="api.js?v=20260707-first-list-boot1"></script>
<script src="service-detail.js?v=20260707-first-list-boot1"></script>
</body>
</html>
