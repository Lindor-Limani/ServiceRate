<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceRate - Service Details</title>
  <link rel="stylesheet" href="customer-style.css" />
</head>
<body>
<header>
  <a class="logo" href="customer-app.html">Service<span>Rate</span></a>
  <div class="header-right">
    <a href="customer-app.html" class="btn btn-ghost btn-sm">Zurueck zum Marktplatz</a>
  </div>
</header>

<main class="main">
  <div id="serviceDetailRoot">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <p>Service wird geladen...</p>
    </div>
  </div>
</main>

<div class="gallery-lightbox" id="galleryLightbox" onclick="if(event.target===this)closeGallery()">
  <button class="modal-close gallery-close" onclick="closeGallery()">✕</button>
  <button class="gallery-nav gallery-prev" onclick="moveGallery(-1)">‹</button>
  <img id="galleryImage" alt="Servicefoto groß" />
  <button class="gallery-nav gallery-next" onclick="moveGallery(1)">›</button>
  <div class="gallery-counter" id="galleryCounter"></div>
</div>

<script src="utils.js"></script>
<script src="api.js"></script>
<script src="service-detail.js"></script>
</body>
</html>
