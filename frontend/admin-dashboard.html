<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>ServiceRate - Admin</title>
  <script>
    try {
      const mode = localStorage.getItem('servicerate_view_mode');
      if (mode !== 'grid' && mode !== 'list') localStorage.setItem('servicerate_view_mode', 'list');
    } catch {}
  </script>
  <link rel="stylesheet" href="customer-style.css?v=20260713-perf-images" />
</head>
<body>
<header>
  <a class="logo" href="customer-app.html">Service<span>Rate</span></a>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="adminLogout()">Abmelden</button>
  </div>
</header>
<main class="main">
  <section id="adminLogin" class="service-detail-side" style="max-width:420px;margin:0 auto">
    <h1 style="margin-bottom:1rem">Admin Login</h1>
    <div class="form-group">
      <label class="form-label">E-Mail</label>
      <input class="form-input" id="adminEmail" type="email" />
    </div>
    <div class="form-group">
      <label class="form-label">Passwort</label>
      <input class="form-input" id="adminPassword" type="password" onkeydown="if(event.key==='Enter')adminLogin()" />
    </div>
    <button class="btn btn-primary btn-full" onclick="adminLogin()">Anmelden</button>
  </section>

  <section id="adminContent" style="display:none">
    <div class="section-header">
      <h1 class="section-title">Admin Dashboard</h1>
      <button class="btn btn-ghost btn-sm" onclick="loadAdminData()">Aktualisieren</button>
    </div>
    <div class="admin-stats" id="adminStats"></div>
    <div class="filter-chips" id="adminTabs"></div>
    <section class="admin-panel" id="adminMainPanel"></section>
  </section>
</main>
<script src="utils.js?v=20260713-perf-images"></script>
<script src="api.js?v=20260713-perf-images"></script>
<script src="admin-dashboard.js"></script>
</body>
</html>
