<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiceRate – Handwerker finden</title>
    <link rel="stylesheet" href="customer-style.css" />
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════════════════════ -->
<header>
    <a class="logo" href="customer-app.html">Service<span>Rate</span></a>

    <div class="weather-widget" id="weatherWidget">
        <span class="w-icon" id="weatherIcon">🌡️</span>
        <span class="w-text" id="weatherText">Wien…</span>
    </div>

    <div class="header-right">
        <span id="navUser" style="font-size:.84rem;color:var(--muted)"></span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none" onclick="logout()">Abmelden</button>
        <button class="btn btn-primary btn-sm" id="loginNavBtn" onclick="openAuthModal('login')">Anmelden</button>
        <a href="provider-dashboard.html" class="btn btn-ghost btn-sm">Für Handwerker →</a>
    </div>
</header>

<!-- ══ HERO ════════════════════════════════════════════════════════════════ -->
<section class="hero">
    <h1>Finde den richtigen<br/><em>Handwerker</em> in Wien</h1>
    <p>Echte Profis, transparente Preise – gebucht in Sekunden.</p>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Was brauchst du? z.B. Fensterputzen…" />
        <select id="categoryFilter">
            <option value="">Alle Kategorien</option>
            <option value="CLEANING">Reinigung</option>
            <option value="PLUMBING">Installateur</option>
            <option value="ELECTRICAL">Elektriker</option>
            <option value="PAINTING">Maler</option>
            <option value="GARDENING">Garten</option>
            <option value="OTHER">Sonstiges</option>
        </select>
        <button class="btn btn-primary" onclick="applyFilters()">Suchen</button>
    </div>
</section>

<!-- ══ MAIN ════════════════════════════════════════════════════════════════ -->
<main class="main">

    <div class="auth-tabs" id="customerTabs" style="display: none; max-width: 400px; margin-bottom: 2rem;">
        <button class="auth-tab active" id="tabMarket" onclick="switchCustomerTab('market')">Marktplatz</button>
        <button class="auth-tab" id="tabMyBookings" onclick="switchCustomerTab('bookings')">Meine Buchungen</button>
    </div>

    <div id="marketView">
        <div class="filter-chips" id="filterChips">
            <button class="chip active" data-cat="">Alle</button>
            <button class="chip" data-cat="CLEANING">Reinigung</button>
            <button class="chip" data-cat="PLUMBING">Installateur</button>
            <button class="chip" data-cat="ELECTRICAL">Elektriker</button>
            <button class="chip" data-cat="PAINTING">Maler</button>
            <button class="chip" data-cat="GARDENING">Garten</button>
            <button class="chip" data-cat="OTHER">Sonstiges</button>
        </div>

        <div class="section-header">
            <h2 class="section-title">Verfügbare Services</h2>
            <span class="count-pill" id="countPill">–</span>
        </div>

        <div class="cards-grid" id="servicesGrid">
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>Services werden geladen…</p>
            </div>
        </div>
    </div>

    <div id="bookingsView" style="display: none;">
        <div class="section-header">
            <h2 class="section-title">Meine Anfragen & Buchungen</h2>
        </div>
        <div class="cards-grid" id="customerBookingsGrid">
        </div>
    </div>

</main>

<!-- ══ SERVICE DETAIL MODAL ════════════════════════════════════════════════ -->
<div class="overlay" id="serviceModal" onclick="if(event.target===this)closeServiceModal()">
    <div class="modal" id="serviceModalContent"></div>
</div>

<!-- ══ AUTH MODAL ══════════════════════════════════════════════════════════ -->
<div class="overlay" id="authModal" onclick="if(event.target===this)closeAuthModal()">
    <div class="modal" style="max-width:430px">
        <div class="modal-header">
            <h2 class="modal-title">Willkommen</h2>
            <button class="modal-close" onclick="closeAuthModal()">✕</button>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin"  onclick="switchAuthTab('login')">Anmelden</button>
            <button class="auth-tab"        id="tabReg"    onclick="switchAuthTab('register')">Registrieren</button>
        </div>

        <div id="authAlert" class="alert"></div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label class="form-label">E-Mail</label>
                <input class="form-input" type="email" id="loginEmail" placeholder="du@beispiel.at" />
            </div>
            <div class="form-group">
                <label class="form-label">Passwort</label>
                <input class="form-input" type="password" id="loginPassword" placeholder="••••••••"
                       onkeydown="if(event.key==='Enter')doLogin()" />
            </div>
            <button class="btn btn-primary btn-full" onclick="doLogin()">Anmelden</button>
        </div>

        <!-- Register Form -->
        <div id="regForm" style="display:none">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Vorname</label>
                    <input class="form-input" type="text" id="regFirst" placeholder="Max" />
                </div>
                <div class="form-group">
                    <label class="form-label">Nachname</label>
                    <input class="form-input" type="text" id="regLast" placeholder="Muster" />
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">E-Mail</label>
                <input class="form-input" type="email" id="regEmail" placeholder="du@beispiel.at" />
            </div>
            <div class="form-group">
                <label class="form-label">Passwort</label>
                <input class="form-input" type="password" id="regPassword" placeholder="Mindestens 6 Zeichen" />
            </div>
            <div class="form-group">
                <label class="form-label">Ich bin…</label>
                <select class="form-input" id="regType">
                    <option value="CUSTOMER">Kunde (suche Handwerker)</option>
                    <option value="PROVIDER">Handwerker (biete Services an)</option>
                </select>
            </div>
            <button class="btn btn-primary btn-full" onclick="doRegister()">Konto erstellen</button>
        </div>
    </div>
</div>

<!-- ══ TOAST ═══════════════════════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script src="customer-app.js"></script>
</body>
</html>
