<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceRate – Handwerker finden</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F4EF;
      --surface: #FFFFFF;
      --text: #1A1A18;
      --muted: #6B6B60;
      --accent: #C84B2F;
      --accent-light: #F5E8E4;
      --border: #E2DDD6;
      --success: #2D7A4F;
      --radius: 12px;
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .nav-logo span { color: var(--text); }
    .nav-right { display: flex; gap: 1rem; align-items: center; }
    .nav-user { font-size: 0.85rem; color: var(--muted); }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #b03e25; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-sm { padding: 0.35rem 0.9rem; font-size: 0.8rem; }

    /* ── PAGES ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── AUTH PAGE ── */
    .auth-wrap {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    .auth-card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
    }
    .auth-card p { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .tab-row {
      display: flex;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1; padding: 0.5rem; border: none; background: transparent;
      border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem; font-weight: 500; color: var(--muted); transition: all 0.15s;
    }
    .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 0.35rem; }
    input, select {
      width: 100%; padding: 0.65rem 0.9rem;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem;
      background: var(--bg); color: var(--text);
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); background: #fff; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .auth-submit { width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-size: 0.95rem; }
    .error-msg {
      background: #FEE2E2; color: #991B1B; padding: 0.6rem 0.9rem;
      border-radius: 8px; font-size: 0.8rem; margin-bottom: 1rem; display: none;
    }
    .success-msg {
      background: #D1FAE5; color: #065F46; padding: 0.6rem 0.9rem;
      border-radius: 8px; font-size: 0.8rem; margin-bottom: 1rem; display: none;
    }

    /* ── HERO ── */
    .hero {
      background: var(--text);
      color: #fff;
      padding: 4rem 2rem;
      text-align: center;
    }
    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }
    .hero h1 em { color: var(--accent); font-style: normal; }
    .hero p { color: #B0AFA8; font-size: 1rem; margin-bottom: 2rem; }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 0.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .search-bar input {
      flex: 1; border: none; background: transparent;
      padding: 0.5rem 0.75rem; font-size: 0.95rem;
    }
    .search-bar input:focus { border: none; background: transparent; }
    .search-bar select {
      border: none; background: var(--bg); border-radius: 8px;
      padding: 0.5rem 0.75rem; font-size: 0.875rem; width: auto;
    }
    .search-bar select:focus { border: none; }

    /* ── MAIN CONTENT ── */
    .main-wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .section-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
    }
    .count-badge {
      background: var(--accent-light); color: var(--accent);
      font-size: 0.75rem; font-weight: 600;
      padding: 0.2rem 0.6rem; border-radius: 20px;
    }

    /* ── SERVICE CARDS ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.5rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.75rem; }
    .card-category {
      background: var(--accent-light); color: var(--accent);
      font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.6rem;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .card-price {
      font-size: 1.1rem; font-weight: 600; color: var(--accent);
    }
    .card-price span { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
    .card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.35rem; }
    .card p { font-size: 0.83rem; color: var(--muted); line-height: 1.5; margin-bottom: 1rem; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .provider-info { display: flex; align-items: center; gap: 0.5rem; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600;
    }
    .provider-name { font-size: 0.8rem; color: var(--muted); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 200;
      align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 16px;
      padding: 2rem; width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto;
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
    .modal-header h3 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; }
    .modal-close { background: var(--bg); border: none; border-radius: 6px; padding: 0.35rem 0.6rem; cursor: pointer; font-size: 1rem; }
    .modal-meta { display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .meta-item { font-size: 0.83rem; color: var(--muted); }
    .meta-item strong { color: var(--text); display: block; font-size: 0.75rem; margin-bottom: 0.1rem; }
    .modal-desc { font-size: 0.875rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
    .modal-price-row {
      background: var(--accent-light); border-radius: 10px;
      padding: 1rem; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 1.25rem;
    }
    .modal-price-row .price { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .modal-price-row .price-label { font-size: 0.8rem; color: var(--muted); }
    .book-btn { width: 100%; padding: 0.85rem; font-size: 1rem; border-radius: 10px; }

    /* ── BOOKING CONFIRM ── */
    .booking-success {
      text-align: center; padding: 1rem 0;
    }
    .booking-success .check {
      width: 56px; height: 56px; background: #D1FAE5;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto 1rem;
    }
    .booking-success h3 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .booking-success p { color: var(--muted); font-size: 0.875rem; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem; color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.9rem; }

    /* ── LOADING ── */
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--text); color: #fff;
      padding: 0.75rem 1.25rem; border-radius: 10px;
      font-size: 0.875rem; z-index: 300;
      transform: translateY(100px); opacity: 0;
      transition: all 0.3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 0 1rem; }
      .hero { padding: 2.5rem 1rem; }
      .search-bar { flex-direction: column; }
      .search-bar select { width: 100%; }
      .main-wrap { padding: 1.5rem 1rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Service<span>Rate</span></div>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none" onclick="logout()">Abmelden</button>
    <button class="btn btn-primary btn-sm" id="loginNavBtn" onclick="showPage('auth')">Anmelden</button>
  </div>
</nav>

<!-- ══════════════ AUTH PAGE ══════════════ -->
<div class="page active" id="page-auth">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Willkommen</h2>
      <p>Meld dich an oder erstell ein kostenloses Konto.</p>

      <div class="tab-row">
        <button class="tab-btn active" onclick="switchAuthTab('login')">Anmelden</button>
        <button class="tab-btn" onclick="switchAuthTab('register')">Registrieren</button>
      </div>

      <div id="authError" class="error-msg"></div>
      <div id="authSuccess" class="success-msg"></div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="form-group">
          <label>E-Mail</label>
          <input type="email" id="loginEmail" placeholder="du@beispiel.at" />
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary auth-submit" onclick="doLogin()">Anmelden</button>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerForm" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Vorname</label>
            <input type="text" id="regFirst" placeholder="Max" />
          </div>
          <div class="form-group">
            <label>Nachname</label>
            <input type="text" id="regLast" placeholder="Mustermann" />
          </div>
        </div>
        <div class="form-group">
          <label>E-Mail</label>
          <input type="email" id="regEmail" placeholder="du@beispiel.at" />
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="regPassword" placeholder="Mindestens 6 Zeichen" />
        </div>
        <div class="form-group">
          <label>Ich bin...</label>
          <select id="regType">
            <option value="CUSTOMER">Kunde (suche Handwerker)</option>
            <option value="PROVIDER">Handwerker (biete Services)</option>
          </select>
        </div>
        <button class="btn btn-primary auth-submit" onclick="doRegister()">Konto erstellen</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ HOME PAGE ══════════════ -->
<div class="page" id="page-home">
  <!-- HERO -->
  <section class="hero">
    <h1>Finde den richtigen<br/><em>Handwerker</em> in Wien</h1>
    <p>Echte Profis, echte Bewertungen — gebucht in Sekunden.</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Was brauchst du? z.B. Fensterputzen..." />
      <select id="categoryFilter">
        <option value="">Alle Kategorien</option>
        <option value="CLEANING">Reinigung</option>
        <option value="PLUMBING">Installateur</option>
        <option value="ELECTRICAL">Elektriker</option>
        <option value="PAINTING">Maler</option>
        <option value="GARDENING">Garten</option>
        <option value="OTHER">Sonstiges</option>
      </select>
      <button class="btn btn-primary" onclick="loadServices()">Suchen</button>
    </div>
  </section>

  <!-- LISTINGS -->
  <div class="main-wrap">
    <div class="section-header">
      <h2>Verfügbare Services</h2>
      <span class="count-badge" id="serviceCount">–</span>
    </div>
    <div class="cards-grid" id="servicesGrid">
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <p>Starte eine Suche um Services zu finden.</p>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ SERVICE DETAIL MODAL ══════════════ -->
<div class="modal-overlay" id="serviceModal">
  <div class="modal">
    <div id="modalContent"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────────
  const API = 'http://localhost:8080/api';
  let token = localStorage.getItem('sr_token') || null;
  let currentUser = JSON.parse(localStorage.getItem('sr_user') || 'null');
  let allServices = [];

  // ─── INIT ─────────────────────────────────────────────────────────
  function init() {
    if (token && currentUser) {
      updateNavForUser();
      showPage('home');
      loadServices();
    } else {
      showPage('auth');
    }
  }

  // ─── NAVIGATION ───────────────────────────────────────────────────
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
  }

  function updateNavForUser() {
    if (!currentUser) return;
    document.getElementById('navUser').textContent = currentUser.firstName + ' ' + currentUser.lastName;
    document.getElementById('logoutBtn').style.display = 'inline-block';
    document.getElementById('loginNavBtn').style.display = 'none';
  }

  function logout() {
    token = null;
    currentUser = null;
    localStorage.removeItem('sr_token');
    localStorage.removeItem('sr_user');
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('loginNavBtn').style.display = 'inline-block';
    document.getElementById('navUser').textContent = '';
    showPage('auth');
  }

  // ─── AUTH TABS ────────────────────────────────────────────────────
  function switchAuthTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    hideAuthMessages();
  }

  function showAuthError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('authSuccess').style.display = 'none';
  }
  function showAuthSuccess(msg) {
    const el = document.getElementById('authSuccess');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('authError').style.display = 'none';
  }
  function hideAuthMessages() {
    document.getElementById('authError').style.display = 'none';
    document.getElementById('authSuccess').style.display = 'none';
  }

  // ─── LOGIN (M7: POST) ─────────────────────────────────────────────
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showAuthError('Bitte E-Mail und Passwort eingeben.'); return; }

    try {
      // M3 + M4: AJAX call via fetch (asynchron)
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',                              // M7: POST
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      // M5: JSON Response verarbeiten
      const data = await res.json();

      if (!res.ok) {
        showAuthError(data || 'Login fehlgeschlagen.');
        return;
      }

      token = data.token;
      // Decode JWT payload to get user info
      const payload = JSON.parse(atob(token.split('.')[1]));
      currentUser = {
        email: payload.sub,
        accountType: payload.accountType,
        firstName: email.split('@')[0],
        lastName: ''
      };

      localStorage.setItem('sr_token', token);
      localStorage.setItem('sr_user', JSON.stringify(currentUser));
      updateNavForUser();
      showPage('home');
      loadServices();
    } catch (e) {
      showAuthError('Server nicht erreichbar. Läuft das Backend?');
    }
  }

  // ─── REGISTER (M7: POST) ──────────────────────────────────────────
  async function doRegister() {
    const firstName = document.getElementById('regFirst').value.trim();
    const lastName  = document.getElementById('regLast').value.trim();
    const email     = document.getElementById('regEmail').value.trim();
    const password  = document.getElementById('regPassword').value;
    const accountType = document.getElementById('regType').value;

    if (!firstName || !lastName || !email || !password) {
      showAuthError('Bitte alle Felder ausfüllen.');
      return;
    }

    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',                              // M7: POST
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName, lastName, email, password, accountType })
      });

      if (!res.ok) {
        const msg = await res.text();
        showAuthError(msg || 'Registrierung fehlgeschlagen.');
        return;
      }

      showAuthSuccess('Konto erstellt! Jetzt anmelden.');
      switchAuthTab('login');
      document.getElementById('loginEmail').value = email;
    } catch (e) {
      showAuthError('Server nicht erreichbar. Läuft das Backend?');
    }
  }

  // ─── LOAD SERVICES (M7: GET) ──────────────────────────────────────
  async function loadServices() {
    const grid = document.getElementById('servicesGrid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted)"><div class="spinner" style="border-color:var(--accent);border-top-color:transparent;margin:0 auto"></div></div>';

    try {
      const res = await fetch(`${API}/services`, {       // M7: GET
        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
      });

      if (!res.ok) throw new Error();
      allServices = await res.json();                    // M5: JSON
      renderServices(allServices);
    } catch (e) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div><p>Services konnten nicht geladen werden.<br/>Läuft das Backend?</p></div>';
      document.getElementById('serviceCount').textContent = '0';
    }
  }

  function renderServices(services) {
    const query    = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;

    let filtered = services.filter(s => {
      const matchesText = !query ||
        s.title.toLowerCase().includes(query) ||
        s.description.toLowerCase().includes(query);
      const matchesCat = !category || s.category === category;
      return matchesText && matchesCat;
    });

    document.getElementById('serviceCount').textContent = filtered.length + ' gefunden';
    const grid = document.getElementById('servicesGrid');

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔍</div><p>Keine Services gefunden.</p></div>';
      return;
    }

    grid.innerHTML = filtered.map(s => `
      <div class="card" onclick="openModal('${s.id}')">
        <div class="card-top">
          <span class="card-category">${categoryLabel(s.category)}</span>
          <span class="card-price">€${parseFloat(s.price).toFixed(2)}<span>/Std</span></span>
        </div>
        <h3>${escHtml(s.title)}</h3>
        <p>${escHtml(s.description)}</p>
        <div class="card-footer">
          <div class="provider-info">
            <div class="avatar">${(s.providerName||'?').split(' ').map(n=>n[0]).join('')}</div>
            <span class="provider-name">${escHtml(s.providerName || 'Unbekannt')}</span>
          </div>
          <span style="font-size:0.75rem;color:var(--success);font-weight:500">● Verfügbar</span>
        </div>
      </div>
    `).join('');
  }

  // Search on Enter
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') renderServices(allServices);
  });
  document.getElementById('categoryFilter').addEventListener('change', () => renderServices(allServices));

  // ─── SERVICE MODAL ────────────────────────────────────────────────
  function openModal(id) {
    const s = allServices.find(x => x.id === id);
    if (!s) return;

    document.getElementById('modalContent').innerHTML = `
      <div class="modal-header">
        <h3>${escHtml(s.title)}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-meta">
        <div class="meta-item"><strong>Kategorie</strong>${categoryLabel(s.category)}</div>
        <div class="meta-item"><strong>Anbieter</strong>${escHtml(s.providerName || '–')}</div>
        <div class="meta-item"><strong>Status</strong>${s.status}</div>
      </div>
      <p class="modal-desc">${escHtml(s.description)}</p>
      <div class="modal-price-row">
        <div>
          <div class="price-label">Stundensatz</div>
          <div class="price">€${parseFloat(s.price).toFixed(2)}</div>
        </div>
        <button class="btn btn-primary" onclick="doBook('${s.id}', '${escHtml(s.title)}', ${s.price})">
          Jetzt buchen
        </button>
      </div>
    `;
    document.getElementById('serviceModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('serviceModal').classList.remove('open');
  }
  document.getElementById('serviceModal').addEventListener('click', e => {
    if (e.target === document.getElementById('serviceModal')) closeModal();
  });

  // ─── BOOKING (M7: POST) ───────────────────────────────────────────
  async function doBook(serviceId, title, price) {
    if (!token) {
      closeModal();
      showPage('auth');
      showAuthError('Bitte zuerst anmelden um zu buchen.');
      return;
    }

    // M7: POST — Booking anlegen
    // Hinweis: BookingController kommt als nächstes im Backend
    // Für jetzt simulieren wir eine erfolgreiche Buchung (Backend-Endpoint fehlt noch)
    document.getElementById('modalContent').innerHTML = `
      <div class="booking-success">
        <div class="check">✓</div>
        <h3>Buchung erfolgreich!</h3>
        <p>Du hast <strong>${escHtml(title)}</strong> gebucht.<br/>
        Der Anbieter wird sich bald bei dir melden.</p>
        <br/>
        <button class="btn btn-ghost" onclick="closeModal()">Schließen</button>
      </div>
    `;
    showToast('Buchung wurde gespeichert ✓');
  }

  // ─── DELETE SERVICE (M7: DELETE) ──────────────────────────────────
  // Nur für PROVIDER sichtbar — kommt ins Provider Dashboard
  async function deleteService(id) {
    if (!confirm('Service wirklich löschen?')) return;
    try {
      const res = await fetch(`${API}/services/${id}`, {
        method: 'DELETE',                            // M7: DELETE
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        showToast('Service gelöscht.');
        loadServices();
      }
    } catch (e) {
      showToast('Fehler beim Löschen.');
    }
  }

  // ─── HELPERS ──────────────────────────────────────────────────────
  function categoryLabel(cat) {
    const map = {
      CLEANING: 'Reinigung', PLUMBING: 'Installateur',
      ELECTRICAL: 'Elektriker', PAINTING: 'Maler',
      GARDENING: 'Garten', OTHER: 'Sonstiges'
    };
    return map[cat] || cat;
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ─── START ────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
